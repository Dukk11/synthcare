[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthcare"
version = "1.0.0"
description = "🧬 Synthetic FHIR R4 patient data generator — deterministic, privacy-safe demo populations with conditions, encounters, vitals and labs. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Duk", url = "https://dukdev.com" }]
keywords = ["fhir", "synthetic-data", "healthcare", "hl7", "ehr", "test-data", "medical"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/Dukk11/synthcare"
Repository = "https://github.com/Dukk11/synthcare"
Issues = "https://github.com/Dukk11/synthcare/issues"

[project.scripts]
synthcare = "synthcare.cli:main"

[tool.setuptools]
packages = ["synthcare"]
